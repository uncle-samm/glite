name = "glite"
version = "0.5.0"
description = "A SQLite driver for Gleam on the Erlang VM: isolated transactions, bounded calls, no actor in the way."
licences = ["Apache-2.0"]
repository = { type = "github", user = "uncle-samm", repo = "glite" }
target = "erlang"
gleam = ">= 1.19.0"
internal_modules = ["glite/internal", "glite/internal/*"]

[dependencies]
gleam_stdlib = ">= 1.0.3 and < 2.0.0"
esqlite = ">= 0.10.0 and < 0.11.0"

[dev-dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
